name: pubblica-pwa
# Pubblica la PWA su GitHub Pages: dopo ogni raccolta, quando cambia l'app, o a mano.
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["raccolta-offerte"]
    types: [completed]
  push:
    branches: [main]
    paths: ["pwa/**", "data/offerte.json", "scripts/build_pwa.py", ".github/workflows/pages.yml"]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/build_pwa.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist/spesaok }
      - id: deploy
        uses: actions/deploy-pages@v4
