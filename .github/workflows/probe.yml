name: probe-fonti
on:
  workflow_dispatch:
  push:
    branches: ["explore/**"]
    paths: ["scripts/probe*.py", ".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright==1.48.0 && python -m playwright install --with-deps chromium
      - run: sudo apt-get install -y poppler-utils >/dev/null && cd scripts && python ${PROBE:-probe10}.py
      - uses: actions/upload-artifact@v4
        with: { name: probe_out, path: probe_out }
