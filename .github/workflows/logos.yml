name: scarica-loghi
on:
  workflow_dispatch:
    inputs:
      catene: { description: "catene separate da spazio (vuoto = tutte)", required: false, default: "" }
  # da lanciare a mano: i loghi finiscono in logos_raw/, si scelgono e si copiano in pwa/logos/
permissions:
  contents: write
jobs:
  logos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright==1.48.0 && python -m playwright install --with-deps chromium
      - run: python scripts/fetch_logos.py ${{ github.event.inputs.catene }}
      - run: |
          git config user.name "segugio-bot"
          git config user.email "segugio-bot@users.noreply.github.com"
          git add logos_raw && git commit -m "Loghi scaricati (candidati)" && git push || echo "niente"
